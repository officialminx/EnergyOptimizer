[project]
name = "energyoptimizer"
dynamic = ["version"]
description = "Switches Shelly plugs and MQTT loads with the solar surplus"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = [
    "RUF001",   # ambiguous unicode in strings: the texts are German and use – and „“
    "RUF002",
    "RUF003",
    "SIM102",   # nested ifs read better in the control rules
    "SIM108",
    "B008",
    "RUF046",   # int(round(x)) is kept explicit
    "RUF059",
    "RUF005",
    "SIM105",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011", "SIM115", "SIM117"]

[tool.ruff.lint.isort]
known-first-party = ["energyoptimizer"]

[tool.mypy]
python_version = "3.11"
packages = ["energyoptimizer"]
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true
no_implicit_optional = true
