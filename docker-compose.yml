services:
  energyoptimizer:
    image: ghcr.io/officialminx/energyoptimizer:latest
    # To build locally instead: docker compose up -d --build
    build: .
    container_name: energyoptimizer
    restart: unless-stopped
    # Host networking is required for http://energyoptimizer.local (mDNS)
    # and for discovering Shelly devices on the local network.
    network_mode: host
    environment:
      TZ: Europe/Zurich
      # Web UI port. Change it if another service on the host already uses port 80.
      EO_PORT: "80"
    volumes:
      - ./data:/data
      # Lets "Install update" in the web interface replace this container with the new
      # version. The socket gives full control over Docker on the host: remove this line
      # if you prefer to update with "docker compose pull && docker compose up -d".
      - /var/run/docker.sock:/var/run/docker.sock
